services:
  app:
    build:
      context: .
      args:
        BASE_PATH: /
    ports:
      - "127.0.0.1:5002:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5002}
      BASE_PATH: /
      DATABASE_URL: postgresql://swim:local-swim-only@db:5432/swim
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: swim
      POSTGRES_USER: swim
      POSTGRES_PASSWORD: local-swim-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swim -d swim"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data: